<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaX Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>NovaX Store</h1>
    <p>Packs digitais para gamers e criadores</p>
    <a href="#produtos" class="btn">Comprar Agora</a>
  </header>

  <section id="produtos" class="produtos">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200&auto=format&fit=crop" alt="Pack Gamer">
      <h2>Pack Gamer Neon</h2>
      <p>50 wallpapers + 20 fotos de perfil</p>
      <span>R$ 15</span>
      <button onclick="comprar('Pack Gamer Neon')">Comprar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop" alt="Pack Streamer">
      <h2>Pack Streamer</h2>
      <p>Overlays e banners para lives</p>
      <span>R$ 25</span>
      <button onclick="comprar('Pack Streamer')">Comprar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=1200&auto=format&fit=crop" alt="Pack TikTok">
      <h2>Pack TikTok</h2>
      <p>Templates e efeitos prontos</p>
      <span>R$ 10</span>
      <button onclick="comprar('Pack TikTok')">Comprar</button>
    </div>

  </section>

  <footer>
    <p>© 2026 NovaX Store</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
